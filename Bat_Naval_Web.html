<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <title>Batalha Naval</title>
</head>

<body>
  <h1>Batalha Naval</h1>
  <h2>Instruções</h2>
  <p>O jogo é jogado em um tabuleiro de 5x5.</p>
  <p>Você deve adivinhar a localização dos navios do oponente.</p>
  <p>Os navios podem estar dispostos na horizontal ou vertical.</p>
  <p>O jogo termina quando todos os navios do oponente forem afundados.</p>

  <div id="status">Tiros Restantes: 10 | Barcos Restantes: 3</div>

  <div id="Container">
    <div class="Tabuleiro" id="TabuleiroHtml">
      <!-- O JavaScript preencherá os blocos aqui -->
    </div>
  </div>

  <button onclick="iniciarJogo()">Reiniciar Jogo</button>
</body>

</html>
